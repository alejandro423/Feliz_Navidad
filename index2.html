<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Navidad - Wolf de Sistemas UNIFRANZ! 🎄</title>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at top, #134e2c 0%, #082414 70%, #030f08 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .card {
            background: rgba(12, 38, 22, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid #e32636;
            border-radius: 28px;
            padding: 30px 22px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            z-index: 2;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(227, 38, 54, 0.25);
            animation: fadeIn 1.2s ease-out;
        }
        .header-brand {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .unifranz-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .unifranz-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            color: #ffffff;
        }
        .unifranz-swoosh {
            width: 110px;
            height: 7px;
            background: linear-gradient(90deg, #ff5e00, #ff8c00);
            border-radius: 4px;
            margin: 2px 0 4px 0;
            transform: skewX(-10deg);
        }
        .unifranz-sub {
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
        }
        .community-badge {
            font-size: 0.82rem;
            color: #ffd700;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #c41e3a, #900c1f);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #ffd700;
            margin-top: 6px;
            box-shadow: 0 4px 10px rgba(196, 30, 58, 0.4);
        }
        .icon {
            font-size: 2.8rem;
            margin: 5px 0 10px 0;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            font-family: 'Mountains of Christmas', cursive;
            font-size: 2.6rem;
            color: #ff3333;
            text-shadow: 0 2px 12px rgba(255, 51, 51, 0.5), 0 0 5px #ffd700;
            margin-bottom: 12px;
            line-height: 1.1;
        }
        p {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #f1f8f3;
            margin-bottom: 22px;
            font-weight: 300;
        }
        /* Botón de enlace hacia la felicitación */
        .btn-video {
            display: inline-block;
            background: linear-gradient(135deg, #2e8b57, #1e5631);
            color: white;
            border: 2px solid #ffd700;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(46, 139, 87, 0.5);
        }
        .btn-video:active {
            transform: scale(0.95);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <canvas id="snow"></canvas>

    <div class="card">
        <div class="header-brand">
            <div class="unifranz-logo">
                <span class="unifranz-sub">Universidad Privada</span>
                <span class="unifranz-text">UNIFRANZ</span>
                <div class="unifranz-swoosh"></div>
            </div>
            <div class="community-badge">🐺 Wolf de Sistemas</div>
        </div>

        <div class="icon">🎄✨</div>
        <h1>¡Feliz Navidad!</h1>
        <p>
            Que la comodidad de este detalle te acompañe en cada momento de descanso. 
            Toca el botón de abajo para ver una sorpresa especial preparada para ti.
        </p>
        
        <!-- Botón que redirige a felicitacion.html -->
        <a href="felicitacion2.html" class="btn-video">▶️ Ver video y felicitación</a>

        <div class="footer">Ingeniería de Sistemas • Emprendimiento Navideño</div>
    </div>

    <script>
        const canvas = document.getElementById('snow');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const flakes = Array.from({ length: 65 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 3 + 1,
            d: Math.random() * 1 + 0.5
        }));

        function drawSnow() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            for (let f of flakes) {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            }
            ctx.fill();
            updateSnow();
            requestAnimationFrame(drawSnow);
        }

        function updateSnow() {
            for (let f of flakes) {
                f.y += f.d;
                f.x += Math.sin(f.y * 0.01) * 0.5;
                if (f.y > height) {
                    f.y = -5;
                    f.x = Math.random() * width;
                }
            }
        }
        drawSnow();
    </script>
</body>
</html>
